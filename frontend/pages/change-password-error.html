<!--
Страница отображается в случае ошибки при попытке смены пароля пользователя.
Пользователю предлагается повторить попытку или связаться с поддержкой.
-->

<!doctype html>
<html lang="ru">
  <head>
    <!-- Основные настройки страницы -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Название вкладки -->
    <title>Ошибка смены пароля</title>

    <!-- Подключение общих стилей -->
    <link rel="stylesheet" href="/static/css/stylesheet.css" />

    <!-- Подключение стилей страницы -->
    <link
      rel="stylesheet"
      href="/static/css/pages/change-password-status.css"
    />

    <!-- Скрипт загрузки общих компонентов -->
    <script src="/static/js/load_components.js" defer></script>
  </head>

  <body>
    <!-- Шапка сайта загружается через load_components.js -->
    <header data-component="header"></header>

    <div class="content-grid">
      <!-- Верхняя часть страницы -->
      <section class="change-password-status__top">
        <!-- Заголовок страницы -->
        <h2 class="text__h2">Ошибка смены пароля</h2>
      </section>

      <!-- Основной контент -->
      <section class="change-password-status__main">
        <!-- Сообщение об ошибке -->
        <p class="text__body-smaller">
          Что-то пошло не так при попытке сменить пароль. Пожалуйста,
          <a href="/pages/change-password.html"> попробуйте ещё раз </a>
          или
          <a href="mailto:liliesch55@gmail.com"> свяжитесь с нами </a>.
        </p>
      </section>
    </div>

    <!-- Подвал сайта загружается через load_components.js -->
    <footer data-component="footer"></footer>
  </body>
</html>
