<!--
Страница смены пароля пользователя.
Файл содержит форму для ввода нового пароля
и подтверждения пароля. Проверка данных
и отправка формы выполняются в change-password.ts.
-->

<!doctype html>
<html lang="ru">
  <head>
    <!-- Основные настройки страницы -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Название вкладки -->
    <title>Смена пароля</title>

    <!-- Подключение общих стилей -->
    <link rel="stylesheet" href="/static/css/stylesheet.css" />

    <!-- Подключение стилей страницы смены пароля -->
    <link rel="stylesheet" href="/static/css/pages/change-password.css" />

    <!-- Скрипт загрузки общих компонентов -->
    <script src="/static/js/load_components.js" defer></script>

    <!-- Скрипт обработки формы смены пароля -->
    <script type="module" src="/static/js/change-password.js" defer></script>
  </head>

  <body>
    <!-- Шапка сайта загружается через load_components.js -->
    <header data-component="header"></header>

    <div class="content-grid">
      <!-- Верхняя часть страницы -->
      <section class="change-password__top">
        <!-- Заголовок страницы -->
        <h2 class="text__h2">Смена пароля</h2>
      </section>

      <!-- Основной блок формы -->
      <section class="change-password__main">
        <!-- Краткая инструкция для пользователя -->
        <p class="text__body-smaller">
          Введите новый пароль для вашего аккаунта.
        </p>

        <!-- Поля ввода пароля -->
        <div class="change-password__text-inputs">
          <!-- Поле нового пароля -->
          <div class="text-input">
            <div class="text-input__title">Новый пароль*</div>

            <input
              class="text-input__field"
              type="password"
              id="change-password__new"
              placeholder="Минимум 6 символов"
              autocomplete="new-password"
            />

            <!-- Сообщение об ошибке для нового пароля -->
            <p
              class="text__small-text text-input__message"
              id="change-password__new-msg"
            ></p>
          </div>

          <!-- Поле подтверждения пароля -->
          <div class="text-input">
            <div class="text-input__title">Подтвердите пароль*</div>

            <input
              class="text-input__field"
              type="password"
              id="change-password__confirm"
              placeholder="Повторите пароль"
              autocomplete="new-password"
            />

            <!-- Сообщение об ошибке для подтверждения пароля -->
            <p
              class="text__small-text text-input__message"
              id="change-password__confirm-msg"
            ></p>
          </div>
        </div>

        <!-- Общее сообщение об ошибке -->
        <p
          class="text__small-text"
          id="change-password__general-msg"
          style="display: none; color: var(--error)"
        ></p>

        <!-- Кнопка отправки формы -->
        <button
          class="text__button button__accent2-no-icon"
          id="change-password__submit"
        >
          Сменить пароль
        </button>

        <!-- Ссылка возврата в профиль -->
        <p class="text__body-smaller">
          <a href="/pages/profile.html" style="color: var(--dark-gray)"
            >Вернуться в профиль</a
          >
        </p>
      </section>
    </div>

    <!-- Подвал сайта загружается через load_components.js -->
    <footer data-component="footer"></footer>
  </body>
</html>
