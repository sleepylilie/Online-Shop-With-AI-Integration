<!--
Страница успешной смены пароля.
После изменения пароля пользователю предлагается выполнить вход в аккаунт.
-->

<!doctype html>
<html lang="ru">
  <head>
    <!-- Основные настройки страницы -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Название вкладки -->
    <title>Пароль изменён</title>

    <!-- Подключение общих стилей -->
    <link rel="stylesheet" href="/static/css/stylesheet.css" />

    <!-- Подключение стилей страницы -->
    <link
      rel="stylesheet"
      href="/static/css/pages/change-password-status.css"
    />

    <!-- Скрипт загрузки общих компонентов -->
    <script src="/static/js/load_components.js" defer></script>
  </head>

  <body>
    <!-- Шапка сайта загружается через load_components.js -->
    <header data-component="header"></header>

    <div class="content-grid">
      <!-- Верхняя часть страницы -->
      <section class="change-password-status__top">
        <!-- Заголовок страницы -->
        <h2 class="text__h2">Пароль успешно изменён</h2>
      </section>

      <!-- Основной контент -->
      <section class="change-password-status__main">
        <!-- Сообщение для пользователя -->
        <p class="text__body-smaller">
          Ваш пароль был обновлён. Используйте адрес электронной почты и новый
          пароль, чтобы
          <a href="" id="open-login-popup"> войти в свой аккаунт </a>.
        </p>
      </section>
    </div>

    <!-- Подвал сайта загружается через load_components.js -->
    <footer data-component="footer"></footer>

    <script>
      // Обработчик открытия окна авторизации
      document.addEventListener("click", function (e) {
        // Проверяем, нажал ли пользователь на ссылку входа
        if (e.target && e.target.id === "open-login-popup") {
          e.preventDefault();

          // Получение элементов поп-апа
          var popup = document.getElementById("popup__login");
          var overlay = document.getElementById("auth-overlay");

          // Проверка существования элементов
          if (popup && overlay) {
            // затемнение фона
            overlay.style.display = "flex";

            // показ поп-апа авторизации
            popup.style.display = "flex";
            popup.style.flexDirection = "column";
          }
        }
      });
    </script>
  </body>
</html>
