<!--
Страница успешного оформления заказа.
Файл отображает номер оформленного заказа
и ссылки для перехода в личный кабинет
или возврата на главную страницу.
-->

<!doctype html>
<html lang="ru">
  <head>
    <!-- Основные настройки страницы -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Название вкладки -->
    <title>Заказ оформлен</title>

    <!-- Подключение общих стилей -->
    <link rel="stylesheet" href="/static/css/stylesheet.css" />

    <!-- Скрипт загрузки общих компонентов -->
    <script src="/static/js/load_components.js" defer></script>
  </head>

  <body>
    <!-- Шапка сайта -->
    <header data-component="header"></header>

    <div class="content-grid">
      <!-- Верхняя часть страницы -->
      <section class="order-status__top">
        <!-- Заголовок страницы -->
        <h2 class="text__h2">Заказ оформлен</h2>
      </section>

      <!-- Основной контент -->
      <section class="order-status__main">
        <!-- Сообщение об успешном заказе -->
        <p class="text__body-smaller">
          Заказ №
          <span
            id="order-success__order-number"
            style="font-weight: 700"
          ></span>

          успешно оформлен! Вы можете посмотреть детали в
          <a href="/pages/profile.html"> личном кабинете </a>.
        </p>

        <!-- Ссылка возврата на главную -->
        <p class="text__body-smaller" style="margin-top: 12px">
          <a href="/index.html" style="color: var(--accent2)">
            Вернуться на главную
          </a>
        </p>
      </section>
    </div>

    <!-- Подвал сайта -->
    <footer data-component="footer"></footer>

    <script>
      // Получение номера заказа из URL
      const num = new URLSearchParams(window.location.search).get(
        "order_number",
      );

      // Элемент для вывода номера заказа
      const el = document.getElementById("order-success__order-number");

      // Если номер найден, выводим его на страницу
      if (el && num) {
        el.textContent = num;
      }
    </script>
  </body>
</html>
