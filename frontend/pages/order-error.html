<!--
Страница ошибки оформления заказа.
Файл отображается в случае,
если при оформлении заказа произошла ошибка.
Пользователю предлагается повторить попытку
или связаться с поддержкой.
-->

<!doctype html>
<html lang="ru">
  <head>
    <!-- Основные настройки страницы -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Название вкладки -->
    <title>Ошибка оформления заказа</title>

    <!-- Подключение общих стилей -->
    <link rel="stylesheet" href="/static/css/stylesheet.css" />

    <!-- Скрипт загрузки общих компонентов -->
    <script src="/static/js/load_components.js" defer></script>
  </head>

  <body>
    <!-- Шапка сайта -->
    <header data-component="header"></header>

    <div class="content-grid">
      <!-- Верхняя часть страницы -->
      <section class="order-status__top">
        <!-- Заголовок страницы -->
        <h2 class="text__h2">Ошибка оформления заказа</h2>
      </section>

      <!-- Основной контент -->
      <section class="order-status__main">
        <!-- Сообщение об ошибке -->
        <p class="text__body-smaller">
          Что-то пошло не так при попытке оформить заказ. Пожалуйста, попробуйте
          ещё раз или
          <a href="mailto:liliesch55@gmail.com"> свяжитесь с нами </a>.
        </p>

        <!-- Ссылка возврата в корзину -->
        <p class="text__body-smaller" style="margin-top: 12px">
          <a href="/pages/cart.html" style="color: var(--accent2)">
            Вернуться в корзину
          </a>
        </p>
      </section>
    </div>

    <!-- Подвал сайта -->
    <footer data-component="footer"></footer>
  </body>
</html>
