<!--
Поп-ап для регистрации пользователя
-->

<div class="login-popup" id="popup__register">
  <!-- Верхняя часть окна -->
  <div class="login__top">
    <!-- Заголовок -->
    <h3 class="text__h3">Регистрация</h3>

    <!-- Кнопка закрытия -->
    <button class="login__close" id="register__close-btn" title="Закрыть">
      <img
        class="icon"
        src="/static/assets/icons/icon_close_black.svg"
        alt="Закрыть"
      />
    </button>
  </div>

  <!-- Основной контент -->
  <div class="login__main">
    <!-- Поля формы -->
    <div class="login__text-inputs">
      <!-- Поле имени -->
      <div class="text-input">
        <div class="text-input__title">Имя*</div>

        <input
          class="text-input__field"
          type="text"
          id="register__first-name"
          placeholder="Иван"
          autocomplete="given-name"
        />

        <!-- Сообщение об ошибке -->
        <p
          class="text__small-text text-input__message"
          id="register__first-name-msg"
        ></p>
      </div>

      <!-- Поле электронной почты -->
      <div class="text-input">
        <div class="text-input__title">Адрес электронной почты*</div>

        <input
          class="text-input__field"
          type="email"
          id="register__email"
          placeholder="example@yandex.ru"
          autocomplete="email"
        />

        <!-- Сообщение об ошибке -->
        <p
          class="text__small-text text-input__message"
          id="register__email-msg"
        ></p>
      </div>

      <!-- Поле пароля -->
      <div class="text-input">
        <div class="text-input__title">Пароль*</div>

        <!-- Тип password скрывает вводимые символы -->
        <input
          class="text-input__field"
          type="password"
          id="register__password"
          placeholder="Минимум 6 символов"
          autocomplete="new-password"
        />

        <!-- Сообщение об ошибке -->
        <p
          class="text__small-text text-input__message"
          id="register__password-msg"
        ></p>
      </div>

      <!-- Подтверждение пароля -->
      <div class="text-input">
        <div class="text-input__title">Подтвердите пароль*</div>

        <!-- Повторный ввод пароля -->
        <input
          class="text-input__field"
          type="password"
          id="register__password-confirm"
          placeholder="Повторите пароль"
          autocomplete="new-password"
        />

        <!-- Сообщение об ошибке -->
        <p
          class="text__small-text text-input__message"
          id="register__password-confirm-msg"
        ></p>
      </div>

      <!-- Общая ошибка от сервера -->
      <p
        class="text__small-text"
        id="register__general-msg"
        style="color: var(--error); display: none"
      ></p>

      <p class="text__body-smaller">* — поля обязательны для заполнения</p>
    </div>

    <!-- Кнопки и ссылки -->
    <div class="login__buttons">
      <!-- Кнопка регистрации -->
      <button
        class="text__button button__accent2-no-icon"
        id="register__submit"
      >
        Зарегистрироваться
      </button>

      <!-- Переход к окну входа -->
      <p class="text__body-smaller">
        Есть аккаунт?
        <a href="#" id="register__go-to-login"> Войти </a>
      </p>
    </div>
  </div>
</div>
